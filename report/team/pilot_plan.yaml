  scope: "Chỉ áp dụng cho yêu cầu noi_dia (CPS 2.696 đ = 0,22x baseline, thành công 95,0%, simulated) và hang_nang (CPS 8.221 đ = 0,69x baseline, thành công 74,1%, simulated) tại cả 12 depot; loại quoc_te (CPS 22.515 đ = 1,88x, thành công 27,3%, simulated) và doi_tac (CPS 10.215 đ = 0,85x, điều khoản riêng, simulated)"
