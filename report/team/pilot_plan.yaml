    - "NẾU chi phí thực tế mỗi việc thành công (đo bằng thời gian xem lại và làm lại thật) vượt 8.000 đ hoặc tỉ lệ yêu cầu phải làm lại vượt 8,0% TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ còn noi_dia và giới hạn tối đa 2 lần chạy mỗi yêu cầu KHÔNG THÌ không được tiếp tục mở trợ lý cho nhóm hang_nang hoặc tăng tỉ lệ rollout"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý (sua hoặc bo trên số yêu cầu được xem lại) vượt 40,0% hoặc tỉ lệ yêu cầu hợp lệ ở nhóm can thiệp được mở bằng trợ lý dưới 60,0% TRONG 1 tuần làm việc THÌ Trưởng nhóm CSKH phỏng vấn tối thiểu 5 nhân viên trong 3 ngày để chỉnh sửa mẫu gợi ý và giao diện duyệt KHÔNG THÌ không được nâng bước rollout sang nấc tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn hằng ngày và chi phí/mức độ sử dụng hằng tuần; chỉ phân tích kết luận chỉ số chính một lần khi bước rollout 0.50 tích luỹ đủ ít nhất 299 yêu cầu/nhân viên và qua đủ 7 ngày theo dõi mở lại"
