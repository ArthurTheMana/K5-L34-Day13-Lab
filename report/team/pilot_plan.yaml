# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml', encoding='utf-8'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.250 yêu cầu mỗi nhóm (statsmodels NormalIndPower; 1.251 theo xấp xỉ chuẩn hai tỉ lệ).
#   b) Theo nhân viên, m = 75: DE = 1 + (75 - 1) * 0,02 = 2,48; cỡ mẫu 3.099 yêu cầu/nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40 người: không đủ nhân viên).
#   c) 20 nhân viên mỗi nhóm: cỡ mẫu hiệu dụng tối đa < c / ICC = 20 / 0,02 = 1.000 mẫu/nhóm (< 1.250 ở câu a: không đạt MDE 5 điểm).
#   d) 6 depot mỗi nhóm: cỡ mẫu hiệu dụng tối đa < 6 / 0,02 = 300 mẫu/nhóm (không đủ mẫu và chỉ có 6 cụm mỗi nhóm < 20 cụm: loại).
#   e) Mức chênh 6 điểm (859 mẫu hiệu dụng mỗi nhóm), 20 nhân viên mỗi nhóm: giải 20*m / (1 + (m - 1)*0,02) >= 859 -> cần ít nhất m = 299 yêu cầu mỗi nhân viên (DE = 6,96; cỡ mẫu hiệu dụng = 859,20).
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia theo nhân viên (20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng xử lý yêu cầu song song cùng tuần, cùng ca và cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên bằng code có seed cố định ghi trước, phân tầng (stratified) theo 12 depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro nhân viên cùng depot trao đổi câu trả lời; giảm bằng phân quyền mở trợ lý theo tài khoản staff_id và ghi log event agent_usage_recorded kèm trace_id để kiểm toán nhiễm chéo.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chỉ số chính, MDE 0,06, ba luật dừng và ngày ra quyết định 2026-12-28 được khoá trước ngày chạy pilot.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 nhân viên (20 cụm) ở nhóm dùng trợ lý và 20 nhân viên (20 cụm) ở nhóm đối chứng.
#
# Đánh đổi đã chấp nhận:
#   Với tổng 40 nhân viên và ICC = 0,02, trần cỡ mẫu hiệu dụng là 1.000/nhóm nên không cách chia theo cụm nào đạt power 0,80 ở mức chênh +5 điểm (cần 1.250/nhóm). Nhóm chọn chia theo staff (20 + 20 cụm) để tránh nhiễu tràn tác động nặng của chia theo request, chấp nhận nới MDE lên +6 điểm (m >= 299 yêu cầu/nhân viên, tổng 5.980 yêu cầu/nhóm). Điểm bất lợi: nếu tác động thật chỉ là +5 điểm thì power thực tế chỉ còn khoảng 0,64 (64,2%).
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Dữ liệu chạy thử có tỉ lệ mở lại trong 7 ngày là 4,25% trên toàn mẫu (51/1.200) và 3,97% trong phạm vi noi_dia + hang_nang (39/982). Nếu đặt ngưỡng dừng tuyệt đối 3% thì pilot sẽ dừng nhầm ngay tuần đầu; vì vậy nhóm đặt luật dừng so với nhóm đối chứng đồng thời (cao hơn đối chứng từ 2,0 điểm phần trăm trở lên) kèm trần tuyệt đối 6,0% và ngưỡng 1 ca hoàn tiền trùng.

pilot:
